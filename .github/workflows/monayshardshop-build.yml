name: Build MonayShardShop
on:
  push:
    paths:
      - 'MonayShardShop/**'
      - '.github/workflows/monayshardshop-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: MonayShardShop
        run: gradle build --no-daemon
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: MonayShardShop
          path: MonayShardShop/build/libs/*.jar
